<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuchs Fibercraft - BBS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #2d0052 50%, #1a0033 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(255,20,147,0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(128,0,128,0.1) 0%, transparent 50%);
            pointer-events: none; z-index: 1;
        }
        .container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 2; }
        header {
            text-align: center; margin-bottom: 40px; padding: 30px 20px;
            background: rgba(0,0,0,0.6); border-radius: 20px; border: 2px solid #ff1493;
            box-shadow: 0 0 30px rgba(255,20,147,0.5), 0 0 60px rgba(128,0,128,0.3);
        }
        .logo { font-size: 80px; margin-bottom: 10px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);} }
        h1 {
            font-size: 48px;
            background: linear-gradient(90deg,#ff1493,#9400d3,#000);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
            font-weight:bold; margin-bottom:10px; animation:textBlink 2s infinite;
        }
        @keyframes textBlink { 0%,50%,100%{opacity:1;} 25%,75%{opacity:0.7;} }
        .tagline { font-size:20px; color:#ff1493; animation:colorBlink 1.5s infinite; font-weight:bold; }
        @keyframes colorBlink { 0%,100%{color:#ff1493;text-shadow:0 0 10px #ff1493;} 50%{color:#9400d3;text-shadow:0 0 10px #9400d3;} }
        nav { display:flex; justify-content:center; gap:20px; margin-bottom:20px; flex-wrap:wrap; }
        nav a { padding:12px 25px; background:rgba(255,20,147,0.8); color:#fff; text-decoration:none; border-radius:25px; border:2px solid #9400d3; font-weight:bold; }
        nav a:hover { transform:scale(1.05); }
        /* Footer */
        footer { text-align:center; padding:30px; background:rgba(0,0,0,0.8); border-top:3px solid #ff1493; border-radius:15px; box-shadow:0 0 20px rgba(255,20,147,0.4); }
        .footer-links { display:flex; justify-content:center; gap:20px; margin-bottom:20px; flex-wrap:wrap; }
        .footer-link { display:inline-flex; align-items:center; gap:10px; padding:12px 25px; background:rgba(255,20,147,0.8); color:#fff; text-decoration:none; border-radius:25px; border:2px solid #9400d3; font-weight:bold; }
        .creator-credit { color:#9400d3; font-size:14px; margin-top:20px; font-style:italic; }
        .discord-ticket { padding:12px 20px; background:#7289da; color:#fff; border-radius:8px; text-decoration:none; font-weight:bold; }
        @media (max-width:768px){ h1{font-size:36px;} .logo{font-size:60px;} nav{flex-direction:column;} nav a{width:100%; text-align:center;} .footer-links{flex-direction:column; gap:10px;} }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">🦊</div>
            <h1>💰 FUCHS FIBERCRAFT 💰</h1>
            <div class="tagline">✨ BBS / CONTACT PAGE ✨</div>
            <div style="margin-top:18px;">
                <a class="discord-ticket" href="https://discord.gg/pqsC66NgYS" target="_blank">🎟️ Open Discord Ticket</a>
            </div>
        </header>

        <!-- Navigation -->
        <nav>
            <a href="#home">🏠 HOME</a>
            <a href="#footer">📞 CONTACT</a>
            <a href="https://discord.gg/pqsC66NgYS" target="_blank">💬 Discord</a>
        </nav>

        <!-- BBS content placeholder -->
        <main style="margin-bottom:40px; text-align:center;">
            <div class="alert" style="display:inline-block; padding:20px 30px;">Welcome to the Fuchs Fibercraft BBS page — use the Discord ticket button above for private services and support.</div>
        </main>

        <!-- Footer -->
        <footer id="footer">
            <div class="cart-title" style="margin-bottom: 20px; font-size:20px; color:#ff1493;">CONTACT US</div>
            <div class="footer-links">
                <a href="https://discord.gg/pqsC66NgYS" target="_blank" class="footer-link">🎮 Discord</a>
            </div>
            <div class="creator-credit">✨ Created by Odin AEDCE ✨</div>
        </footer>
    </div>
</body>
</html>
